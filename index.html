<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141312" />
    <title>Paint Index — Citadel & Vallejo cross-reference</title>
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/app.css?v=1.0.0-beta.4" />
    <script src="./firebase.js"></script>
  </head>
  <body>
    <header>
      <h1>Paint Index</h1>
      <p>
        Cross-reference Citadel Colour &amp; Vallejo paints · HEX / B&amp;C index
        converter · ΔE color matching
      </p>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="active" data-tab="browse" role="tab">
        Browse
      </button>
      <button type="button" data-tab="inventory" role="tab">Inventory</button>
      <button type="button" data-tab="match" role="tab">Cross-reference</button>
      <button type="button" data-tab="hex" role="tab">HEX lab</button>
    </nav>

    <main>
      <section id="panel-browse" class="panel active" role="tabpanel">
        <div class="toolbar">
          <input
            type="search"
            id="browse-search"
            placeholder="Search by name, hex, Citadel #, Vallejo code…"
            autocomplete="off"
          />
          <select id="browse-brand" aria-label="Brand filter">
            <option value="all">All brands</option>
            <option value="citadel">Citadel Colour</option>
            <option value="vallejo">Vallejo</option>
          </select>
          <select id="browse-line" aria-label="Line filter">
            <option value="all">All lines</option>
          </select>
        </div>
        <p class="stats" id="browse-stats"></p>
        <div id="browse-grid" class="grid"></div>
      </section>

      <section id="panel-inventory" class="panel" role="tabpanel">
        <div class="inventory-auth-banner" id="inventory-auth-banner">
          <strong>Cloud sync available</strong>
          <p>
            Local inventories are device-specific. Sign in with Google to sync
            your paints across devices.
          </p>
          <button type="button" class="secondary" id="google-login-button">
            Sign in with Google
          </button>
        </div>

        <div class="inventory-header">
          <div class="inventory-profile-group">
            <div class="profile-card">
              <label for="inventory-profile-name">Profile</label>
              <input
                type="text"
                id="inventory-profile-name"
                autocomplete="off"
                maxlength="48"
              />
            </div>

            <div class="inventory-auth-user" id="inventory-auth-user" hidden>
              <div>
                <strong id="auth-user-name">Authenticated</strong>
                <p id="auth-user-email">Cloud inventory enabled</p>
              </div>
              <button type="button" class="secondary" id="google-logout-button">
                Sign out
              </button>
            </div>
          </div>

          <div class="inventory-summary" id="inventory-summary"></div>
        </div>

        <div class="toolbar">
          <input
            type="search"
            id="inventory-search"
            placeholder="Search paints to add, or leave blank to view your inventory…"
            autocomplete="off"
          />
          <select id="inventory-status" aria-label="Inventory status filter">
            <option value="all">Owned & wishlist</option>
            <option value="owned">Owned</option>
            <option value="wishlist">Wishlist</option>
          </select>
          <select id="inventory-brand" aria-label="Inventory brand filter">
            <option value="all">All brands</option>
            <option value="citadel">Citadel Colour</option>
            <option value="vallejo">Vallejo</option>
          </select>
          <select id="inventory-sort" aria-label="Inventory sort order">
            <option value="name">Sort: Name</option>
            <option value="hue">Sort: Hue</option>
            <option value="brand">Sort: Brand</option>
          </select>
          <button type="button" class="secondary" id="inventory-export">
            Export JSON
          </button>
        </div>
        <p class="stats" id="inventory-stats"></p>
        <div id="inventory-grid" class="grid"></div>
      </section>
    </main>

    <div id="toast" class="copied-toast" aria-live="polite">Copied</div>

    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/app.js?v=1.0.0-beta.4"></script>
  </body>
</html>
